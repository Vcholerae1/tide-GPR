name: Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  static-and-cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install development environment
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Unit and contract tests
        run: >-
          uv run coverage run --parallel-mode -m pytest -q
          -m "not numerical and not cuda and not slow and not openmp and not benchmark"

      - name: Fast numerical correctness
        run: >-
          uv run coverage run --parallel-mode -m pytest -q
          -m "numerical and not cuda and not slow"

      - name: Python coverage
        run: >-
          uv run coverage combine &&
          uv run coverage report &&
          uv run coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          use_oidc: true


  nightly-cpu:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install development environment
        run: uv sync --group dev

      - name: Slow numerical and OpenMP suite
        run: uv run pytest -q -m "slow and not cuda"

      - name: Upload numerical artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-cpu-numerical
          path: artifacts/
          if-no-files-found: ignore